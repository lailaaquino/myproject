<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Blog para notícias{% endblock %}</title>
</head>
<body>
    <main>
        {% if user.is_authenticated %}
        <form action="{% url 'edu:logout' %}" method="post" style="display:inline; float:right; margin:10px;">
            {% csrf_token %}
            <button type="submit" class="btn btn-link">Sair</button>
        </form>
        {% endif %}
        {% block content %}
        {% endblock %}
    </main>
</body>
<footer>
    {% block footer %}
    {% endblock %}
</footer>
</html>
