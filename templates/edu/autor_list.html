{% extends 'base.html' %}
{% block content %}
<h2>Autores</h2>
<a href="{% url 'autor_create' %}" class="btn btn-primary mb-3">Novo Autor</a>
<div class="table-responsive">
<table class="table table-striped table-bordered align-middle">
    <thead class="table-primary">
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody>
        {% for autor in autores %}
        <tr>
            <td>{{ autor.id }}</td>
            <td>{{ autor.nome }}</td>
            <td>
                <a href="{% url 'edit_autores' autor.id %}" class="btn btn-warning btn-sm">Editar</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
</div>
{% endblock %}
