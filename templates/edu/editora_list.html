{% extends 'base.html' %}
{% block content %}
<h2>Editoras</h2>
<a href="{% url 'editora_create' %}" class="btn btn-primary mb-3">Nova Editora</a>
<div class="table-responsive">
<table class="table table-striped table-bordered align-middle">
    <thead class="table-primary">
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody>
        {% for editora in editoras %}
        <tr>
            <td>{{ editora.id }}</td>
            <td>{{ editora.nome }}</td>
            <td>
                <a href="{% url 'edit_editoras' editora.id %}" class="btn btn-warning btn-sm">Editar</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
</div>
{% endblock %}
